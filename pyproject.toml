[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oddrun"
version = "0.1.0"
description = "Experimental diagnosis of Python behavior differences across environments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Dharmit Kunal Shah" }
]
maintainers = [
    { name = "Dharmit Kunal Shah" }
]
keywords = [
    "python",
    "debugging",
    "reproducibility",
    "environment",
    "diagnostics",
    "testing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
]

[project.scripts]
oddrun = "oddrun.cli:main"

[project.urls]
Homepage = "https://github.com/dkshah25/oddrun"
Documentation = "https://github.com/dkshah25/oddrun#readme"
Repository = "https://github.com/dkshah25/oddrun"
Issues = "https://github.com/dkshah25/oddrun/issues"
Changelog = "https://github.com/dkshah25/oddrun/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
